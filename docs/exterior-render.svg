<svg viewBox="0 0 480 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="title">Shower Thoughts — assembled prototype mounted on shower tile</title>
  <desc id="desc">The sealed gray Polycase WP-23 enclosure mounted on a tiled shower wall by a magnetic plate. Its front face carries an RGB status LED glowing green for ready, a 3mm microphone sound hole with a PTFE vent, a 16mm IP67 push button to start and stop recording, and a silicone-sealed micro-USB charging port on the bottom edge.</desc>

  <rect x="0" y="0" width="480" height="620" fill="#ffffff"/>
  <text x="40" y="36" font-size="16" font-weight="700" fill="#111827">Assembled prototype — mounted on the wall</text>

  <!-- tile wall -->
  <rect x="40" y="54" width="400" height="520" rx="4" fill="#e8eef1"/>
  <g stroke="#d2dde2" stroke-width="2">
    <line x1="40" y1="184" x2="440" y2="184"/>
    <line x1="40" y1="314" x2="440" y2="314"/>
    <line x1="40" y1="444" x2="440" y2="444"/>
    <line x1="173" y1="54" x2="173" y2="574"/>
    <line x1="307" y1="54" x2="307" y2="574"/>
  </g>
  <g fill="#bcd2db">
    <circle cx="95" cy="120" r="3"/><circle cx="400" cy="250" r="2.5"/>
    <circle cx="120" cy="430" r="2.5"/><circle cx="390" cy="520" r="3"/><circle cx="80" cy="520" r="2"/>
  </g>

  <!-- magnetic mount plate behind -->
  <rect x="120" y="120" width="205" height="360" rx="10" fill="#8d9299"/>

  <!-- enclosure depth faces (iso hint) -->
  <polygon points="110,120 130,102 335,102 315,120" fill="#ccd0d6"/>
  <polygon points="315,120 335,102 335,468 315,486" fill="#9a9ea5"/>
  <!-- front face -->
  <rect x="110" y="120" width="205" height="366" rx="8" fill="#bcc0c7" stroke="#878c93" stroke-width="1.5"/>
  <rect x="118" y="128" width="189" height="350" rx="6" fill="none" stroke="#a7abb2" stroke-width="1.5"/>

  <!-- RGB LED (green = ready) -->
  <circle cx="175" cy="168" r="14" fill="#38c172" opacity="0.25"/>
  <circle cx="175" cy="168" r="7" fill="#2fb866" stroke="#1f8f4d" stroke-width="1"/>
  <!-- mic sound hole + PTFE vent rings -->
  <circle cx="250" cy="168" r="10" fill="#e8eaed" stroke="#878c93" stroke-width="1"/>
  <circle cx="250" cy="168" r="6" fill="#d4d7dc" stroke="#9a9ea5" stroke-width="0.8"/>
  <circle cx="250" cy="168" r="2.2" fill="#6b7280"/>
  <!-- 16mm push button -->
  <circle cx="212" cy="310" r="42" fill="#c7cace" stroke="#7d8087" stroke-width="2"/>
  <circle cx="212" cy="310" r="33" fill="#d9dce0" stroke="#9a9ea5" stroke-width="1.5"/>
  <circle cx="212" cy="310" r="24" fill="#eef0f2" stroke="#b6bac0" stroke-width="1"/>
  <circle cx="212" cy="310" r="6" fill="#bcc0c7"/>
  <!-- micro-USB charge port (bottom, sealed) -->
  <rect x="190" y="458" width="44" height="11" rx="5" fill="#6b7280"/>
  <rect x="197" y="461" width="30" height="5" rx="2.5" fill="#3f444b"/>
  <!-- brand etch -->
  <text x="212" y="420" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="1.5" opacity="0.7">shower thoughts</text>

  <!-- leader labels -->
  <line x1="175" y1="168" x2="78" y2="110" stroke="#9aa0a6" stroke-width="1" fill="none"/>
  <text x="76" y="106" font-size="12" fill="#1f2937" text-anchor="end">RGB status LED</text>
  <text x="76" y="121" font-size="10" fill="#6b7280" text-anchor="end">green = ready</text>

  <line x1="250" y1="168" x2="400" y2="118" stroke="#9aa0a6" stroke-width="1" fill="none"/>
  <text x="404" y="114" font-size="12" fill="#1f2937">Mic sound hole</text>
  <text x="404" y="129" font-size="10" fill="#6b7280">3mm + PTFE vent</text>

  <line x1="254" y1="310" x2="402" y2="310" stroke="#9aa0a6" stroke-width="1" fill="none"/>
  <text x="406" y="306" font-size="12" fill="#1f2937">16mm button</text>
  <text x="406" y="321" font-size="10" fill="#6b7280">IP67, start/stop</text>

  <line x1="212" y1="469" x2="402" y2="445" stroke="#9aa0a6" stroke-width="1" fill="none"/>
  <text x="406" y="441" font-size="12" fill="#1f2937">Micro-USB port</text>
  <text x="406" y="456" font-size="10" fill="#6b7280">RTV-sealed slot</text>

  <line x1="120" y1="440" x2="70" y2="460" stroke="#9aa0a6" stroke-width="1" fill="none"/>
  <text x="68" y="456" font-size="12" fill="#1f2937" text-anchor="end">Magnet plate</text>
  <text x="68" y="471" font-size="10" fill="#6b7280" text-anchor="end">snaps off to charge</text>

  <text x="212" y="530" font-size="12" fill="#6b7280" text-anchor="middle">Polycase WP-23 · 4.5 × 3.5 × 2.1 in</text>
  <text x="212" y="548" font-size="12" fill="#6b7280" text-anchor="middle">gray polycarbonate · NEMA 4X / IP65</text>
</svg>

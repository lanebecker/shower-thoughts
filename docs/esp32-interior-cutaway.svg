<svg viewBox="0 0 830 700" width="830" height="700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="title">Shower Thoughts (ESP32-S3 build) — interior cutaway (top-down, lid removed)</title>
  <desc id="desc">Top-down view into the open WP-23 enclosure for the ESP32-S3 build. Along the front face are the ghosted button (with its external 100k ohm pull-up resistor), RGB LED and microphone sound hole. Inside sit the INMP441 I2S microphone under the sound hole, the ESP32-S3-DevKitC-1 dev board in the center, the LiPo battery on the left, and the TP4056 charger and MT3608 boost converter on the right. A legend on the right lists the exact ESP32-S3 GPIO assignments for the microphone, button, RGB LED, power path, and optional battery-sense divider.</desc>

  <rect x="0" y="0" width="830" height="700" fill="#ffffff"/>

  <text x="40" y="40" font-size="18" font-weight="700" fill="#111827">Shower Thoughts (ESP32-S3) — Interior Layout</text>
  <text x="40" y="60" font-size="11" fill="#6b7280">Top-down, lid removed · ESP32-S3-DevKitC-1 + INMP441 · front-face holes ghosted along the top edge</text>

  <!-- ENCLOSURE FOOTPRINT -->
  <rect x="50" y="86" width="560" height="430" rx="12" fill="#cfd3d8" stroke="#878c93" stroke-width="2"/>
  <rect x="64" y="100" width="532" height="402" rx="8" fill="#eef0f2" stroke="#b6bac0" stroke-width="1"/>
  <g fill="#c2c6cc" stroke="#9aa0a6" stroke-width="1">
    <circle cx="80" cy="116" r="6"/><circle cx="580" cy="116" r="6"/><circle cx="80" cy="486" r="6"/><circle cx="580" cy="486" r="6"/>
  </g>

  <!-- front face + ghosted holes -->
  <text x="330" y="96" font-size="10" fill="#9aa0a6" text-anchor="middle">front face (lid) — holes ghosted</text>
  <circle cx="300" cy="118" r="9" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="300" cy="118" r="3" fill="#cdd1d6"/>
  <circle cx="388" cy="120" r="17" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="388" y="123" font-size="8" fill="#9aa0a6" text-anchor="middle">btn</text>
  <circle cx="436" cy="120" r="8" fill="#eafaf0" stroke="#1f8f4d" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- external 100k pull-up resistor on the button -->
  <rect x="408" y="150" width="10" height="18" rx="2" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
  <text x="424" y="163" font-size="8.5" fill="#b45309">100kΩ pull-up</text>

  <!-- INMP441 MIC -->
  <rect x="262" y="146" width="78" height="40" rx="4" fill="#3a3f4b" stroke="#23262e" stroke-width="1.5"/>
  <circle cx="300" cy="166" r="6" fill="#e8eaed" stroke="#23262e" stroke-width="1"/>
  <circle cx="300" cy="166" r="2" fill="#6b7280"/>
  <text x="301" y="205" font-size="10" fill="#374151" text-anchor="middle">INMP441 mic</text>

  <!-- LiPo -->
  <rect x="92" y="300" width="116" height="150" rx="8" fill="#c9ccd1" stroke="#9aa0a6" stroke-width="1.5"/>
  <rect x="92" y="300" width="116" height="16" rx="8" fill="#b3b7bd"/>
  <text x="150" y="380" font-size="11" fill="#6b7280" text-anchor="middle">1000 mAh</text>
  <text x="150" y="395" font-size="11" fill="#6b7280" text-anchor="middle">LiPo cell</text>

  <!-- ESP32-S3-DevKitC-1 -->
  <rect x="244" y="318" width="240" height="86" rx="8" fill="#1f2433" stroke="#0e1118" stroke-width="1.5"/>
  <rect x="256" y="324" width="216" height="9" rx="2" fill="#0e1118"/>
  <rect x="256" y="389" width="216" height="9" rx="2" fill="#0e1118"/>
  <g fill="#d9a441">
    <circle cx="266" cy="328" r="1.5"/><circle cx="282" cy="328" r="1.5"/><circle cx="298" cy="328" r="1.5"/><circle cx="314" cy="328" r="1.5"/><circle cx="330" cy="328" r="1.5"/><circle cx="346" cy="328" r="1.5"/><circle cx="362" cy="328" r="1.5"/><circle cx="378" cy="328" r="1.5"/><circle cx="394" cy="328" r="1.5"/><circle cx="410" cy="328" r="1.5"/><circle cx="426" cy="328" r="1.5"/><circle cx="442" cy="328" r="1.5"/><circle cx="458" cy="328" r="1.5"/>
    <circle cx="266" cy="393" r="1.5"/><circle cx="282" cy="393" r="1.5"/><circle cx="298" cy="393" r="1.5"/><circle cx="314" cy="393" r="1.5"/><circle cx="330" cy="393" r="1.5"/><circle cx="346" cy="393" r="1.5"/><circle cx="362" cy="393" r="1.5"/><circle cx="378" cy="393" r="1.5"/><circle cx="394" cy="393" r="1.5"/><circle cx="410" cy="393" r="1.5"/><circle cx="426" cy="393" r="1.5"/><circle cx="442" cy="393" r="1.5"/><circle cx="458" cy="393" r="1.5"/>
  </g>
  <!-- RF shield + antenna -->
  <rect x="418" y="344" width="46" height="34" rx="3" fill="#aeb4bd" stroke="#7d8087" stroke-width="1"/>
  <text x="441" y="365" font-size="8" fill="#3f444b" text-anchor="middle">S3</text>
  <path d="M428,338 h8 v-6 h8 v6 h8 v-6 h8" fill="none" stroke="#c07b3a" stroke-width="1.5"/>
  <!-- USB-C ports (flashing) at left end -->
  <rect x="238" y="348" width="8" height="14" rx="2" fill="#cfd3d8"/>
  <rect x="238" y="366" width="8" height="14" rx="2" fill="#cfd3d8"/>
  <text x="262" y="346" font-size="8" fill="#8d9299">USB-C</text>
  <text x="300" y="372" font-size="11" fill="#cdd3de" text-anchor="middle">ESP32-S3-DevKitC-1</text>
  <g fill="#9aa0a6" stroke="#6b7280" stroke-width="0.8"><circle cx="256" cy="398" r="4.5"/><circle cx="472" cy="398" r="4.5"/><circle cx="256" cy="324" r="4.5"/><circle cx="472" cy="324" r="4.5"/></g>

  <!-- POWER MODULES -->
  <rect x="506" y="150" width="78" height="36" rx="3" fill="#c0392b" stroke="#922b21" stroke-width="1"/>
  <text x="545" y="172" fill="#ffffff" font-size="10" text-anchor="middle">TP4056</text>
  <rect x="506" y="196" width="78" height="34" rx="3" fill="#2b6cb0" stroke="#1f4e80" stroke-width="1"/>
  <text x="545" y="217" fill="#ffffff" font-size="10" text-anchor="middle">MT3608</text>
  <text x="545" y="246" font-size="9" fill="#b45309" text-anchor="middle">set 5.1V</text>

  <!-- WIRING (indicative) -->
  <path d="M300,186 C300,250 300,280 300,324" fill="none" stroke="#d9822b" stroke-width="2"/>
  <path d="M388,137 C388,230 392,280 392,324" fill="none" stroke="#7c5cbf" stroke-width="2"/>
  <path d="M436,128 C436,230 430,280 430,324" fill="none" stroke="#2f9e8f" stroke-width="2"/>
  <rect x="425" y="250" width="10" height="16" rx="2" fill="#ffffff" stroke="#2f9e8f" stroke-width="1.2"/>
  <text x="448" y="262" font-size="8" fill="#2f9e8f">330Ω×3</text>
  <path d="M208,316 C420,250 470,200 506,168" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 3"/>
  <path d="M545,230 C545,275 500,300 484,330" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 3"/>

  <text x="330" y="540" font-size="10" fill="#6b7280" text-anchor="middle">Wires are indicative — exact GPIO pins listed at right. Deep-sleeps between presses, so it rarely needs charging.</text>

  <!-- WIRING LEGEND -->
  <text x="636" y="96" font-size="12" font-weight="700" fill="#111827">Wiring — ESP32-S3 GPIO</text>

  <rect x="636" y="108" width="12" height="12" rx="2" fill="#d9822b"/>
  <text x="654" y="118" font-size="11" font-weight="700" fill="#374151">INMP441 microphone</text>
  <g font-size="10" fill="#4b5563">
    <text x="636" y="134">VDD → 3V3 · GND → GND</text>
    <text x="636" y="148">SD → GPIO11</text>
    <text x="636" y="162">SCK → GPIO12</text>
    <text x="636" y="176">WS → GPIO13</text>
    <text x="636" y="190">L/R → GND (left ch.)</text>
  </g>

  <rect x="636" y="206" width="12" height="12" rx="2" fill="#7c5cbf"/>
  <text x="654" y="216" font-size="11" font-weight="700" fill="#374151">Button (RTC GPIO — wake)</text>
  <g font-size="10" fill="#4b5563">
    <text x="636" y="232">GPIO14 ↔ GND (active-low)</text>
    <text x="636" y="246" fill="#b45309">+ external 100kΩ → 3V3</text>
  </g>

  <rect x="636" y="262" width="12" height="12" rx="2" fill="#2f9e8f"/>
  <text x="654" y="272" font-size="11" font-weight="700" fill="#374151">RGB LED (common cathode)</text>
  <g font-size="10" fill="#4b5563">
    <text x="636" y="288">R → 330Ω → GPIO4</text>
    <text x="636" y="302">G → 330Ω → GPIO5</text>
    <text x="636" y="316">B → 330Ω → GPIO6</text>
    <text x="636" y="330">cathode → GND</text>
  </g>

  <rect x="636" y="346" width="12" height="12" rx="2" fill="#c0392b"/>
  <text x="654" y="356" font-size="11" font-weight="700" fill="#374151">Power path</text>
  <g font-size="10" fill="#4b5563">
    <text x="636" y="372">USB → TP4056 → LiPo</text>
    <text x="636" y="386">→ MT3608 (5.1V) → 5V pin</text>
  </g>

  <rect x="636" y="402" width="12" height="12" rx="2" fill="#7a869a"/>
  <text x="654" y="412" font-size="11" font-weight="700" fill="#374151">Battery sense (optional)</text>
  <g font-size="10" fill="#4b5563">
    <text x="636" y="428">LiPo+ →100kΩ→ GPIO1 (ADC1)</text>
    <text x="636" y="442">→100kΩ→ GND · ratio 2.0</text>
  </g>

  <rect x="636" y="458" width="176" height="44" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1"/>
  <text x="646" y="476" font-size="9.5" fill="#b45309">⚠ Button pull-up is required —</text>
  <text x="646" y="489" font-size="9.5" fill="#b45309">  internal one is off in deep sleep.</text>
</svg>
